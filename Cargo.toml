[package]
name = "unfk"
version = "1.2.1"
edition = "2021"
description = "A fast, modern CLI tool for scanning and repairing file formatting issues"
license = "MIT"
repository = "https://github.com/keathmilligan/unfk"
keywords = ["cli", "formatting", "line-endings", "indentation", "encoding"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "unfk"
path = "src/main.rs"

[dependencies]
# CLI framework
clap = { version = "4", features = ["derive", "env", "wrap_help"] }

# File walking and gitignore support
ignore = "0.4"
walkdir = "2"
globset = "0.4"

# Configuration
toml = "0.8"
serde = { version = "1", features = ["derive"] }

# EditorConfig support
ec4rs = "1"

# Encoding detection and conversion
encoding_rs = "0.8"
chardetng = "0.1"

# Parallelism
rayon = "1"

# Output formatting
colored = "2"

# TTY detection for interactive mode
atty = "0.2"

# Error handling
thiserror = "1"
anyhow = "1"

# File operations
tempfile = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = true
strip = true
