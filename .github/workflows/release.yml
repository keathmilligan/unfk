name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    uses: keathmilligan/release-infra/.github/workflows/release.yml@master
    with:
      project-name: unfk
      binary-name: unfk
      project-type: rust
      targets: >-
        x86_64-apple-darwin,
        aarch64-apple-darwin,
        x86_64-pc-windows-msvc,
        aarch64-pc-windows-msvc,
        x86_64-unknown-linux-gnu,
        aarch64-unknown-linux-gnu,
        x86_64-unknown-linux-musl,
        aarch64-unknown-linux-musl
      tap-repo: keathmilligan/homebrew-tap
      bucket-repo: keathmilligan/scoop-bucket
      packages-repo: keathmilligan/packages
      enable-cargo: true
      enable-install-scripts: true
      enable-homebrew: false
      enable-scoop: false
      enable-chocolatey: false
      enable-winget: false
      enable-apt: false
      enable-rpm: false
      enable-apk: false
      enable-dmg: false
      enable-aur: false
    secrets: inherit
